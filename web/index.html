<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Poetry Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="kicker">古典詩詞數據庫</p>
        <h1>Chinese Poetry Search</h1>
        <p class="subtitle">按朝代、作者或詩句快速查詢本倉庫中的古典詩詞與文集。</p>
      </div>
      <div class="hero-note">
        <strong>源數據</strong>：<span>chinese-poetry</span> JSON 倉庫
      </div>
    </header>

    <section class="search-panel">
      <div class="field-group">
        <label for="datasetSelect">選擇類別</label>
        <select id="datasetSelect"></select>
      </div>
      <div class="field-group">
        <label for="dynastySelect">按朝代篩選</label>
        <select id="dynastySelect"></select>
      </div>
      <div class="field-group">
        <label for="authorInput">作者 / 詩人</label>
        <input id="authorInput" type="text" placeholder="輸入作者姓名，支持模糊搜索" />
      </div>
      <div class="field-group flex-grow">
        <label for="textInput">詩句 / 標題 / 內容</label>
        <input id="textInput" type="text" placeholder="輸入詩句、詞句或標題關鍵詞" />
      </div>
      <div class="button-row">
        <button id="searchButton" class="primary">開始搜索</button>
        <button id="resetButton" class="secondary">重置</button>
      </div>
      <p class="hint">搜索過程中將按所選類別逐步加載對應 JSON 文件，首次查詢可能需要幾秒鐘。</p>
    </section>

    <section class="status-panel" hidden>
      <div id="statusText"></div>
      <div class="progress-bar"><div id="progressBar"></div></div>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>搜索結果</h2>
        <span id="resultCount">尚未搜索</span>
      </div>
      <div id="results"></div>
    </section>

    <footer class="page-footer">
      <p>頁面僅使用瀏覽器和本倉庫的 JSON 數據構建，支持本地靜態託管。</p>
      <p>在倉庫根目錄運行：<code>python3 -m http.server 8000</code>，然後打開 <code>/web/index.html</code></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
