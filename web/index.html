<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chinese Poetry Search</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div>
        <p class="kicker">古典诗词数据库</p>
        <h1>Chinese Poetry Search</h1>
        <p class="subtitle">按朝代、作者或诗句快速查询本仓库中的古典诗词与文集。</p>
      </div>
      <div class="hero-note">
        <strong>源数据</strong>：<span>chinese-poetry</span> JSON 仓库
      </div>
    </header>

    <section class="search-panel">
      <div class="field-group">
        <label for="datasetSelect">选择类别</label>
        <select id="datasetSelect"></select>
      </div>
      <div class="field-group">
        <label for="dynastySelect">按朝代筛选</label>
        <select id="dynastySelect"></select>
      </div>
      <div class="field-group">
        <label for="authorInput">作者 / 诗人</label>
        <input id="authorInput" type="text" placeholder="输入作者姓名，支持模糊搜索" />
      </div>
      <div class="field-group flex-grow">
        <label for="textInput">诗句 / 标题 / 内容</label>
        <input id="textInput" type="text" placeholder="输入诗句、词句或标题关键词" />
      </div>
      <div class="button-row">
        <button id="searchButton" class="primary">开始搜索</button>
        <button id="resetButton" class="secondary">重置</button>
      </div>
      <p class="hint">搜索过程中将按所选类别逐步加载对应 JSON 文件，首次查询可能需要几秒钟。</p>
    </section>

    <section class="status-panel" hidden>
      <div id="statusText"></div>
      <div class="progress-bar"><div id="progressBar"></div></div>
    </section>

    <section class="results-panel">
      <div class="results-header">
        <h2>搜索结果</h2>
        <span id="resultCount">尚未搜索</span>
      </div>
      <div id="results"></div>
    </section>

    <footer class="page-footer">
      <p>页面仅使用浏览器和本仓库的 JSON 数据构建，支持本地静态托管。</p>
      <p>在仓库根目录运行：<code>python3 -m http.server 8000</code>，然后打开 <code>/web/index.html</code></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
